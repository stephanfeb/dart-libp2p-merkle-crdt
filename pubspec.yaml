name: dart_libp2p_merkle_crdt
description: "Replicates Merkle-CRDTs (the merkledag package) between dart_libp2p peers: heads announced over GossipSub, DAG blocks fetched and served over libp2p streams."
version: 1.0.0
repository: https://github.com/stephanfeb/dart-libp2p-merkle-crdt
issue_tracker: https://github.com/stephanfeb/dart-libp2p-merkle-crdt/issues

environment:
  sdk: ^3.5.1

# Add regular dependencies here.
dependencies:
  # path: ^1.8.0
  crypto: ^3.0.3
  merkledag: ^1.0.1

  # Ranges rather than ^1.x: dart_libp2p 2.0.0 changes no API used here and
  # differs only on the UDX wire, and kad_dht/pubsub 1.3.0 accept it.
  dart_libp2p_pubsub: '>=1.1.0 <2.0.0'

  dart_libp2p: '>=1.0.0 <3.0.0'

  dart_libp2p_kad_dht: '>=1.2.0 <2.0.0'



  dcid: ^1.0.0

  collection: ^1.17.1
  logging: ^1.2.0
  protobuf: ^3.1.0
  x25519: ^0.1.1
  fixnum: ^1.1.0
  cryptography: ^2.7.0
  bs58: ^1.0.2
  dart_multihash: ^1.0.1
  base32: ^2.1.3
  uuid: ^4.4.2
  synchronized: ^3.3.0+3
  clock: ^1.1.1
  pinenacl: ^0.6.0
  multibase: ^1.0.0
  cbor: 6.3.5
  convert: ^3.1.0

dev_dependencies:
  # The same range dart_libp2p_kad_dht accepts: dart_libp2p 1.x uses 2.x.
  dart_udx: '>=2.0.1 <4.0.0'
  matcher: ^0.12.16
  lints: ^4.0.0
  test: ^1.24.0
  mockito: ^5.4.5 # Or latest version
  build_runner: ^2.4.11 # Or latest version

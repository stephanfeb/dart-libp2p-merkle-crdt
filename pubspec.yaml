name: dart_libp2p_merkle_crdt
description: "Replicates Merkle-CRDTs (the merkledag package) between dart_libp2p peers: heads announced over GossipSub, DAG blocks fetched and served over libp2p streams."
version: 2.0.0
repository: https://github.com/stephanfeb/dart-libp2p-merkle-crdt
issue_tracker: https://github.com/stephanfeb/dart-libp2p-merkle-crdt/issues

environment:
  sdk: ^3.5.1

dependencies:
  collection: ^1.17.1
  # dart_libp2p before 4.0.1 throws "Stream is closed" from its UDX/yamux
  # write path in the integration tests. pubsub 1.6.0 is the first with
  # topic validators. Tests pass at both ends of these ranges.
  dart_libp2p: '>=4.0.1 <5.0.0'
  dart_libp2p_kad_dht: '>=1.2.0 <2.0.0'
  dart_libp2p_pubsub: '>=1.6.0 <4.0.0'
  dcid: ^1.0.0
  logging: ^1.2.0
  merkledag: ^2.0.0

dev_dependencies:
  # The same range dart_libp2p_kad_dht accepts.
  dart_udx: '>=2.0.1 <5.0.0'
  lints: ^4.0.0
  test: ^1.24.0

dependency_overrides:
  # Until merkledag 2.0.0 is on pub.dev.
  merkledag:
    path: ../merkledag
